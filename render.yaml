services:

  # ── apps/ingestion is NOT declared here (deliberate, pending an owner) ──────
  #
  # `apps/ingestion` (Express, port 3005, `GET /health`) is a real buildable
  # workspace package, and production callers assume it exists:
  #   - apps/api/src/routes/admin/targets.ts        (INGESTION_URL, /run, /run/all)
  #   - apps/web/src/app/api/search/route.ts       (INGESTION_SERVICE_URL)
  #   - apps/web/src/app/api/admin/discovery/jobs/process/route.ts
  #   - .github/workflows/cron.yml                 (Keep-Alive Ping)
  #
  # It is absent from this blueprint, so it is deployed by some route this
  # repository cannot see. Its address is supplied only through deployment
  # environment variables (GitHub `secrets.INGESTION_URL` / `vars.INGESTION_URL`,
  # Render dashboard), whose values are not in the repo. The only concrete
  # hostname found is in `files/planning/.archive/`, which is not a source of
  # truth for production.
  #
  # A service entry was NOT added on purpose. Guessing a host here would create
  # a second, empty ingestion service the next time this blueprint is synced,
  # and the callers above would keep using the old address anyway.
  #
  # TO RESOLVE: confirm the real host and its owner, then either add the service
  # below or delete this block. Until then treat `INGESTION_URL` as required
  # configuration for fresherflow-api and fresherflow-web.
  #
  # Also note: the build commands below still use `npm ci` and
  # `package-lock.json`, but the repo has no package-lock.json and pins
  # `packageManager: pnpm@12.4.2`. Left as-is (out of scope) — these services
  # cannot build until that is reconciled.

  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: fresherflow-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run deploy:api   # generates prisma, migrates, builds
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # set in Render dashboard → Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json

  # ── WORKER (runs as web service on free tier — binds health port) ────────────
  - type: web
    name: fresherflow-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=@fresherflow/database && npx turbo run build --filter=fresherflow-worker
    startCommand: npm run start --workspace=apps/worker
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # same Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString

  # ── MCP (read-only AI interface, no database access) ────────────────────────
  - type: web
    name: fresherflow-mcp
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npx turbo run build --filter=fresherflow-mcp
    startCommand: npm run start --workspace=apps/mcp
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: FRESHERFLOW_API_URL
        sync: false          # public API base URL, e.g. https://api.fresherflow.in
      - key: PUBLIC_SITE_URL
        value: https://fresherflow.in
    buildFilter:
      paths:
        - apps/mcp/**
        - package.json

  # ── REDIS ────────────────────────────────────────────────────────────────────
  - type: redis
    name: fresherflow-redis
    plan: free
    region: singapore
    ipAllowList: []
