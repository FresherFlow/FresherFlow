services:

  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: fresherflow-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run deploy:api   # generates prisma, migrates, builds
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # set in Render dashboard → Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json

  # ── WORKER (runs as web service on free tier — binds health port) ────────────
  - type: web
    name: fresherflow-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=@fresherflow/database && npx turbo run build --filter=fresherflow-worker
    startCommand: npm run start --workspace=apps/worker
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # same Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString

  # ── MCP (read-only AI interface, no database access) ────────────────────────
  - type: web
    name: fresherflow-mcp
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npx turbo run build --filter=fresherflow-mcp
    startCommand: npm run start --workspace=apps/mcp
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: FRESHERFLOW_API_URL
        sync: false          # public API base URL, e.g. https://api.fresherflow.in
      - key: PUBLIC_SITE_URL
        value: https://fresherflow.in
    buildFilter:
      paths:
        - apps/mcp/**
        - package.json

  # ── REDIS ────────────────────────────────────────────────────────────────────
  - type: redis
    name: fresherflow-redis
    plan: free
    region: singapore
    ipAllowList: []
