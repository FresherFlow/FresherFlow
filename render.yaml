services:

  # ── apps/ingestion is NOT declared here (deliberate, pending an owner) ──────
  #
  # `apps/ingestion` (Express, port 3005, `GET /health`) is a real buildable
  # workspace package, and production callers assume it exists:
  #   - apps/api/src/routes/admin/targets.ts        (INGESTION_URL, /run, /run/all)
  #   - apps/web/src/app/api/search/route.ts       (INGESTION_SERVICE_URL)
  #   - apps/web/src/app/api/admin/discovery/jobs/process/route.ts
  #   - .github/workflows/cron.yml                 (Keep-Alive Ping)
  #
  # It is absent from this blueprint, so it is deployed by some route this
  # repository cannot see. Its address is supplied only through deployment
  # environment variables (GitHub `secrets.INGESTION_URL` / `vars.INGESTION_URL`,
  # Render dashboard), whose values are not in the repo. The only concrete
  # hostname found is in `files/planning/.archive/`, which is not a source of
  # truth for production.
  #
  # A service entry was NOT added on purpose. Guessing a host here would create
  # a second, empty ingestion service the next time this blueprint is synced,
  # and the callers above would keep using the old address anyway.
  #
  # TO RESOLVE: confirm the real host and its owner, then either add the service
  # below or delete this block. Until then treat `INGESTION_URL` as required
  # configuration for fresherflow-api and fresherflow-web.
  #
  # Also note: the build commands below still use `npm ci` and
  # `package-lock.json`, but the repo has no package-lock.json and pins
  # `packageManager: pnpm@10.34.7`. Left as-is (out of scope) — these services
  # cannot build until that is reconciled.

  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: fresherflow-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run deploy:api   # generates prisma, migrates, builds
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # set in Render dashboard → Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: API_URL
        value: https://api.fresherflow.in
      - key: MCP_PUBLIC_URL
        value: https://mcp.fresherflow.in
      # ── Web origin and session cookie ───────────────────────────────────
      # getCookieDomain() derives `.fresherflow.in` from PUBLIC_FRONTEND_URL,
      # and AUTH_COOKIE_DOMAIN states it outright. This pair is what lets the
      # web host and api.fresherflow.in share one session: without it the MCP
      # sign-in handoff loops between /login and /oauth/authorize, and every
      # protected web route bounces back to /login. The API logs an explicit
      # "[auth] No cookie domain resolved" error at boot when both are missing.
      - key: PUBLIC_FRONTEND_URL
        value: https://fresherflow.in
      # FRONTEND_URL is the name the CORS origin allowlist (src/index.ts), the
      # alert/email links and the static-feed base URL read. Same origin, second
      # name: if only one of the two is set, the browser is blocked by CORS even
      # though the cookie domain is right.
      - key: FRONTEND_URL
        value: https://fresherflow.in
      - key: AUTH_COOKIE_DOMAIN
        value: .fresherflow.in
      # Service key for pipeline scripts and the CSRF machine allowlist. The
      # MCP OAuth path does not use it. Set in the dashboard, and paste the
      # same value into the pipeline environment.
      - key: INTERNAL_API_SECRET
        sync: false
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - package-lock.json

  # ── WORKER (runs as web service on free tier — binds health port) ────────────
  - type: web
    name: fresherflow-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=fresherflow-worker
    startCommand: pnpm --filter fresherflow-worker start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false          # same Neon connection string
      - key: REDIS_URL
        fromService:
          type: redis
          name: fresherflow-redis
          property: connectionString

  # ── REDIS ────────────────────────────────────────────────────────────────────
  - type: redis
    name: fresherflow-redis
    plan: free
    region: singapore
    ipAllowList: []
