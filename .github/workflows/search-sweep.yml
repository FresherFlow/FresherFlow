name: Job Scraper (Search Engine)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  run-search-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'

      - name: Install Search Dependencies
        working-directory: scripts/search
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: scripts/search
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Workspace Packages
        run: pnpm build --filter "@fresherflow/constants" --filter "@fresherflow/types" --filter "@fresherflow/utils" --filter "@fresherflow/parser" --filter "@fresherflow/domain" --filter "@fresherflow/plugins" --filter "@fresherflow/pipeline"

      - name: Run Job Scraper Sweep
        working-directory: scripts/search
        env:
          CDN_SIGNATURE_SECRET: ${{ secrets.CDN_SIGNATURE_SECRET }}
          NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm start --dork

      - name: Upload Discovered Jobs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-jobs
          path: scripts/search/discovered_jobs.json
          retention-days: 7
