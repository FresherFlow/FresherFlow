name: Job Scraper (Search Engine)

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

jobs:
  run-search-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node
        with:
          install-playwright: 'true'

      - name: Install Search Dependencies
        working-directory: scripts/search
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: scripts/search
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Job Scraper Sweep
        working-directory: scripts/search
        env:
          CDN_SIGNATURE_SECRET: ${{ secrets.CDN_SIGNATURE_SECRET }}
          NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm start

      - name: Upload Discovered Jobs JSON Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovered-jobs
          path: scripts/search/discovered_jobs.json
          retention-days: 7
