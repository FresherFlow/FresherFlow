name: ATS Discovery Bot

on:
  schedule:
    - cron: '0 3,15 * * *'   # 8:30 AM + 8:30 PM IST, twice a day
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ats-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node

      - name: Install Discovery Dependencies
        working-directory: scripts/job-discovery
        run: pnpm install

      - name: Install Playwright Browsers
        working-directory: scripts/job-discovery
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Workspace Packages
        run: pnpm build --filter "@fresherflow/constants" --filter "@fresherflow/types" --filter "@fresherflow/utils" --filter "@fresherflow/parser" --filter "@fresherflow/plugins" --filter "@fresherflow/pipeline"

      - name: Run ATS Discovery Bot
        working-directory: scripts/job-discovery
        env:
          CDN_SIGNATURE_SECRET: ${{ secrets.CDN_SIGNATURE_SECRET }}
          NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGESTION_DATABASE_URL: ${{ secrets.INGESTION_DATABASE_URL || secrets.DATABASE_URL }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          GOOGLE_SHEET_SCRIPT_URL: ${{ secrets.GOOGLE_SHEET_SCRIPT_URL }}
          GOOGLE_SHEET_SECRET: ${{ secrets.GOOGLE_SHEET_SECRET }}
          DISCOVERY_MODE: ats
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: pnpm start

      - name: Upload Discovered Jobs Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-discovered-jobs
          path: scripts/job-discovery/discovered_jobs.json
          retention-days: 7
