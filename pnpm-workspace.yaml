packages:
  - 'apps/*'
  - 'packages/*'
  - 'firebase/functions'
  - 'scripts/*'

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@prisma/client': false
  '@prisma/engines': false
  '@sentry/cli': false
  bcrypt: false
  esbuild: false
  msgpackr-extract: false
  prisma: false
  protobufjs: false
  unrs-resolver: false

linkWorkspacePackages: true

overrides:
  tar: "^7.5.7"
  react-native-safe-area-context: "~5.6.2"
  react-dom: "19.1.0"
  uuid: "^10.0.0"
  glob: "^11.0.0"
  whatwg-encoding: "^3.1.1"
  abab: "^2.0.6"
  domexception: "^4.0.0"
  eslint: "9.14.0"
  "@babel/core": "7.25.2"
  typescript: "5.7.3"
  jest: "29.7.0"
  prisma: "6.19.3"
  "@prisma/client": "6.19.3"
  chalk: "4.1.2"

preferWorkspacePackages: true
